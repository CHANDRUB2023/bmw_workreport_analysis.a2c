<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="redFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="blackFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="96" fill="#ffffff" stroke="url(#gold)" stroke-width="12" />

  <g transform="translate(45, 60) scale(0.75)">
    <!-- 3D A -->
    <polygon points="40,320 120,80 180,80 120,320" fill="url(#blackFacet)" stroke="#d97706" stroke-width="3" />
    <polygon points="120,80 240,320 180,320 180,80" fill="url(#redFacet)" stroke="#d97706" stroke-width="3" />
    <polygon points="80,220 210,220 190,260 100,260" fill="#991b1b" stroke="#d97706" stroke-width="3" />

    <!-- 3D 2 -->
    <polygon points="250,80 370,80 390,130 300,220 390,220 370,270 250,270 250,220 330,130 250,130" fill="url(#redFacet)" stroke="#d97706" stroke-width="3" />
    
    <!-- 3D C + Arrow -->
    <path d="M 490 140 Q 380 140 380 230 Q 380 320 490 320 L 510 270 Q 430 270 430 230 Q 430 190 510 190 Z" fill="url(#redFacet)" stroke="#d97706" stroke-width="3" />
    <polygon points="490,40 540,110 460,100" fill="#0f172a" stroke="#d97706" stroke-width="3" />
  </g>

  <!-- Tagline Text -->
  <text x="256" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0f172a" text-anchor="middle" letter-spacing="4">
    A<tspan fill="#dc2626">2</tspan>C
  </text>
</svg>
