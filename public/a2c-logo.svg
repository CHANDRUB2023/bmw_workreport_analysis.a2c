<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients for A -->
    <linearGradient id="redFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="blackFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- 3D Faceted A Mark -->
    <g transform="translate(180, 80)">
      <!-- Left Dark Facet of A -->
      <polygon points="40,240 100,50 140,50 90,240" fill="url(#blackFacet1)" stroke="#d97706" stroke-width="1.5" />
      <!-- Right Red Facet of A -->
      <polygon points="100,50 190,240 140,240 140,50" fill="url(#redFacet1)" stroke="#d97706" stroke-width="1.5" />
      <!-- Crossbar of A -->
      <polygon points="70,160 170,160 155,190 85,190" fill="#991b1b" stroke="#d97706" stroke-width="1.5" />
    </g>

    <!-- 3D Faceted 2 Mark -->
    <g transform="translate(350, 90)">
      <polygon points="10,40 100,40 110,80 40,150 110,150 100,190 10,190 10,150 70,80 10,80" fill="url(#redFacet1)" stroke="#d97706" stroke-width="1.5" />
      <polygon points="40,80 110,80 70,150" fill="url(#blackFacet1)" />
    </g>

    <!-- 3D Faceted C Mark with Upward Arrow -->
    <g transform="translate(480, 40)">
      <!-- Outer C Loop -->
      <path d="M 120 100 Q 30 100 30 170 Q 30 240 120 240 L 140 200 Q 70 200 70 170 Q 70 140 140 140 Z" fill="url(#redFacet1)" stroke="#d97706" stroke-width="1.5" />
      <!-- Inner Dark Facet -->
      <path d="M 100 120 Q 50 120 50 170 Q 50 220 100 220 L 120 190 Q 75 190 75 170 Q 75 150 120 150 Z" fill="url(#blackFacet1)" />
      
      <!-- Upward Arrow Shaft & Head -->
      <path d="M 110 160 L 160 50 L 175 70 L 145 180 Z" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
      <polygon points="160,30 200,80 140,70" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
    </g>

    <!-- Horizontal Logo Text: A2C -->
    <g transform="translate(340, 360)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="4">
        <tspan fill="#0f172a">A</tspan>
        <tspan fill="#dc2626">2</tspan>
        <tspan fill="#0f172a">C</tspan>
      </text>
    </g>

    <!-- Top & Bottom Gold Rules -->
    <line x1="160" y1="395" x2="640" y2="395" stroke="url(#goldStroke)" stroke-width="3" />
    <line x1="160" y1="445" x2="640" y2="445" stroke="url(#goldStroke)" stroke-width="3" />

    <!-- Subtitle Tagline Text: ANY IDEA CONVERTING -->
    <text x="400" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#0f172a" text-anchor="middle" letter-spacing="10">
      ANY IDEA CONVERTING
    </text>
  </g>
</svg>
